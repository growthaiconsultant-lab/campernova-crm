name: OPS-1 synthetic backup recovery rehearsal
on:
  workflow_dispatch: {}
permissions: {}
jobs:
  backup:
    if: github.repository == 'growthaiconsultant-lab/campernova-crm' && github.ref
      == 'refs/heads/codex/ops-1-staging-connectivity-check'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Export public schema and data read-only and encrypt
        env:
          PGDATABASE: postgresql://qa:synthetic_qa_only@127.0.0.1:5432/ops1_qa
          PGCONNECT_TIMEOUT: "15"
          OPS_BACKUP_PUBLIC_KEY: 
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          docker run --rm --network host -e PGDATABASE postgres:17 psql --dbname="$PGDATABASE" -v ON_ERROR_STOP=1 -c "CREATE TABLE deliveries (id integer PRIMARY KEY, label text NOT NULL); CREATE TABLE vehicle_documents (id integer PRIMARY KEY, label text NOT NULL); INSERT INTO deliveries VALUES (1,'QA delivery'); INSERT INTO vehicle_documents VALUES (1,'QA document');"
          docker run --rm postgres:17 pg_dump --version
          trap 'rm -f "$RUNNER_TEMP/ops1-staging-public.dump"' EXIT
          docker run --rm --network host -e PGDATABASE -e PGCONNECT_TIMEOUT postgres:17 pg_dump --dbname="$PGDATABASE" --schema=public --format=custom --no-owner --no-privileges --lock-wait-timeout=15s > "$RUNNER_TEMP/ops1-staging-public.dump"
          docker run --rm -i postgres:17 pg_restore --list < "$RUNNER_TEMP/ops1-staging-public.dump" >/dev/null
          node - "$RUNNER_TEMP/ops1-staging-public.dump" <<'NODE'
          const fs=require('node:fs'),c=require('node:crypto');
          const input=process.argv[2]; const pub=Buffer.from(process.env.OPS_BACKUP_PUBLIC_KEY,'base64');
          if(fs.statSync(input).size>256*1024*1024)throw new Error('BACKUP_TOO_LARGE');
          const plain=fs.readFileSync(input),key=c.randomBytes(32),iv=c.randomBytes(12);
          const cipher=c.createCipheriv('aes-256-gcm',key,iv);
          const encrypted=Buffer.concat([cipher.update(plain),cipher.final()]);
          fs.mkdirSync('encrypted-backup',{recursive:true});
          fs.writeFileSync('encrypted-backup/staging-public.dump.enc',encrypted);
          fs.writeFileSync('encrypted-backup/envelope.json',JSON.stringify({algorithm:'AES-256-GCM+RSA-OAEP-SHA256',iv:iv.toString('base64'),tag:cipher.getAuthTag().toString('base64'),key:c.publicEncrypt({key:pub,oaepHash:'sha256'},key).toString('base64'),sha256:c.createHash('sha256').update(plain).digest('hex')}));
          plain.fill(0);key.fill(0);fs.unlinkSync(input);console.log('ENCRYPTED_BACKUP_CREATED');
          NODE
      - name: Upload encrypted backup only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ops1-staging-encrypted-backup
          path: encrypted-backup/
          retention-days: 1
          if-no-files-found: error
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: qa
          POSTGRES_PASSWORD: synthetic_qa_only
          POSTGRES_DB: ops1_qa
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s
          --health-retries 10
