name: OPS-1 read-only staging authentication
on:
  workflow_dispatch:
permissions: {}
jobs:
  readonly:
    if: github.repository == 'growthaiconsultant-lab/campernova-crm' && github.ref == 'refs/heads/codex/ops-1-staging-connectivity-check'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read migration history only
        env:
          PGDATABASE: ${{ secrets.OPS1_TEMP_STAGING_CONNECTION }}
          PGCONNECT_TIMEOUT: '15'
          PGOPTIONS: '-c default_transaction_read_only=on -c statement_timeout=15000'
        run: |
          test -n "$PGDATABASE"
          psql --dbname="$PGDATABASE" -X -w -A -t -v ON_ERROR_STOP=1 -c "SELECT json_build_object('history', coalesce(json_agg(json_build_object('name',migration_name,'checksum',checksum,'finished',finished_at IS NOT NULL,'rolledBack',rolled_back_at IS NOT NULL) ORDER BY migration_name), '[]'::json)) FROM public._prisma_migrations;"
