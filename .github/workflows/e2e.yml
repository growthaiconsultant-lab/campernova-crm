name: OPS-1 credential-free staging connectivity
on:
  workflow_dispatch:
permissions: {}
jobs:
  connectivity:
    if: github.repository == 'growthaiconsultant-lab/campernova-crm' && github.ref == 'refs/heads/codex/ops-1-staging-connectivity-check'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Probe PostgreSQL SSL negotiation without authentication
        shell: bash
        run: |
          node <<'NODE'
          const net = require('node:net');
          const dns = require('node:dns').promises;
          async function probe(host, port, label) {
            return new Promise(resolve => {
              const socket = net.connect({host, port});
              let done = false;
              const finish = result => {
                if (done) return;
                done = true;
                clearTimeout(timer);
                socket.destroy();
                console.log(JSON.stringify({label, port, result}));
                resolve();
              };
              const timer = setTimeout(() => finish('TIMEOUT'), 10000);
              socket.on('connect', () => {
                const request = Buffer.alloc(8);
                request.writeInt32BE(8, 0);
                request.writeInt32BE(80877103, 4);
                socket.write(request);
              });
              socket.once('data', bytes => finish(bytes[0] === 83 ? 'SSL_ACCEPTED' : 'SSL_RESPONSE_' + bytes[0]));
              socket.on('error', error => finish(error.code));
            });
          }
          (async () => {
            const pool = 'aws-1-eu-central-1.pooler.supabase.com';
            const addresses = await dns.resolve4(pool);
            await Promise.all(addresses.flatMap((host, index) => [5432, 6543].map(port => probe(host, port, 'staging-pool-' + index))));
            await probe('db.iatuhydsfwoeprpbklod.supabase.co', 5432, 'staging-direct');
          })().catch(error => { console.log('DIAGNOSTIC_ERROR_' + error.code); process.exitCode = 1; });
          NODE
